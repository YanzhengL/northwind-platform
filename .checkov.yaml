# Shared by the pre-commit hook and the CI CLI call. No skip-check here: accepted risks
# are skipped inline with a reason and an issue link (ADR 0033).
compact: true
quiet: true
framework:
  - terraform
# Org-specific YAML policies (e.g. CKV2_NW_1 mandatory default_tags) run alongside the built-ins.
external-checks-dir:
  - .checkov/policies
