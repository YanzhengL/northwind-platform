name: ci

on:
  pull_request:
  push:
    branches: [main]

# Nothing by default: each job declares only what it uses (ADR 0034).
permissions: {}

env:
  AWS_REGION: eu-west-2
  TERRAFORM_VERSION: 1.16.6
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    # Explicit bash turns on -eo pipefail, so a failure in a pipeline stops the step.
    shell: bash

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      PRE_COMMIT_VERSION: 4.7.0
      CHECKOV_VERSION: 3.3.29
      TFLINT_VERSION: v0.64.0
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history, so a shallow clone would hide old commits.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: Install pinned tools
        run: pip install "pre-commit==${PRE_COMMIT_VERSION}" "checkov==${CHECKOV_VERSION}"

      - name: 0 repo checks
        run: |
          pre-commit run gitleaks-history --hook-stage manual --all-files
          for hook in trailing-whitespace end-of-file-fixer check-yaml check-merge-conflict \
                      check-added-large-files detect-private-key ruff-check ruff-format \
                      actionlint zizmor; do
            pre-commit run "$hook" --all-files --show-diff-on-failure
          done
      - name: 1 terraform fmt
        run: pre-commit run terraform_fmt --all-files --show-diff-on-failure
      - name: 2 terraform validate
        run: pre-commit run terraform_validate --all-files
      - name: 3 tflint
        run: pre-commit run terraform_tflint --all-files
      - name: 4 checkov
        id: checkov
        run: >-
          checkov --config-file .checkov.yaml --directory terraform
          --output cli --output sarif --output-file-path console,checkov.sarif

      # Runs after a Checkov failure too, or findings would never reach the PR (ADR 0033).
      # Skipped if an earlier step failed, because there is then no SARIF file to upload.
      - name: Upload Checkov findings
        if: ${{ !cancelled() && steps.checkov.outcome != 'skipped' && !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: checkov.sarif
          category: checkov

      # The binary, not aquasecurity/trivy-action: that action's tags were hijacked in
      # March 2026 (CVE-2026-33634). The checksum means a replaced release file fails here.
      - name: Trivy config scan (report only)
        id: trivy
        if: ${{ !cancelled() && steps.checkov.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          curl -fsSLo trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check --strict
          tar -xzf trivy.tar.gz -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" config --format sarif --output trivy.sarif terraform
      - name: Upload Trivy findings
        if: ${{ !cancelled() && steps.trivy.outcome == 'success' && !github.event.pull_request.head.repo.fork }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      plan_stacks: ${{ steps.filter.outputs.plan_stacks }}
      apply_stacks: ${{ steps.filter.outputs.apply_stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Plain git rather than a paths-filter action: one less third-party dependency (ADR 0034).
      - name: Find changed stacks
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Every stack must be listed here, or it is silently never planned (ADR 0030).
          all_stacks=(bootstrap org)
          # bootstrap owns the roles CI runs as, so CI plans it but never applies it.
          no_apply=(bootstrap)

          # A PR checkout is a merge commit, so its first parent is the exact base.
          if [ "$EVENT_NAME" = pull_request ]; then base=HEAD^1; else base=$BEFORE_SHA; fi

          plan=()
          apply=()
          for stack in "${all_stacks[@]}"; do
            git diff --quiet "$base" HEAD -- "terraform/$stack" && continue
            plan+=("$stack")
            [[ " ${no_apply[*]} " == *" $stack "* ]] || apply+=("$stack")
          done

          {
            echo "plan_stacks=$(jq -cn '$ARGS.positional' --args -- "${plan[@]}")"
            echo "apply_stacks=$(jq -cn '$ARGS.positional' --args -- "${apply[@]}")"
          } | tee -a "$GITHUB_OUTPUT"

  plan:
    needs: [static, changes]
    # An empty matrix is an error, and fork PRs get no OIDC token or secrets.
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.outputs.plan_stacks != '[]'
      && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.changes.outputs.plan_stacks) }}
    # Shared with apply: a plan must not read state while an apply is writing it.
    concurrency:
      group: terraform-${{ matrix.stack }}
      cancel-in-progress: false
    env:
      STACK: ${{ matrix.stack }}
      TF_DIR: terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          # The wrapper hides real exit codes, and -detailed-exitcode depends on them.
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Mask AWS identifiers
        run: bash .github/scripts/mask-aws-identifiers.sh
      - name: Write stack inputs
        env:
          TFVARS_ORG: ${{ secrets.TFVARS_ORG }}
          TFVARS_BOOTSTRAP: ${{ secrets.TFVARS_BOOTSTRAP }}
        run: |
          case "$STACK" in
            org) printf '%s\n' "$TFVARS_ORG" ;;
            bootstrap) printf '%s\n' "$TFVARS_BOOTSTRAP" ;;
            *) echo "No inputs defined for stack $STACK" >&2; exit 1 ;;
          esac > "$TF_DIR/terraform.tfvars"
      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        # readonly fails the job if a provider does not match the committed hashes (ADR 0034).
        run: >-
          terraform -chdir="$TF_DIR" init -input=false -lockfile=readonly
          -backend-config="bucket=$TF_STATE_BUCKET"
      - name: terraform plan
        # stdout is dropped because "Refreshing state... [id=...]" prints raw IDs for every
        # resource. `terraform show` below has no such lines and keeps sensitive values redacted.
        run: |
          terraform -chdir="$TF_DIR" plan -input=false -no-color -out=tfplan > /dev/null
          terraform -chdir="$TF_DIR" show -no-color tfplan
      - name: Update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The marker is how a re-run finds its own comment instead of adding another.
          marker="<!-- terraform-plan:$STACK -->"
          summary=$(terraform -chdir="$TF_DIR" show -json tfplan | jq -r -f .github/scripts/plan-summary.jq)
          body=$(printf '%s\n### Terraform plan: `%s`\n\n%s\n\nRedacted plan: [job log](%s)\n' \
            "$marker" "$STACK" "$summary" "$RUN_URL")
          echo "$body" >> "$GITHUB_STEP_SUMMARY"

          comment_id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            | jq -rs --arg marker "$marker" \
              '[.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith($marker)))][0].id // empty')
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi

  infracost:
    needs: [static, changes]
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.outputs.plan_stacks != '[]'
      && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Cost is advice, not a gate (ADR 0033): a failure here must not fail ci-ok.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: infracost/actions/diff@a5783eb98adc93aa7a0049fce0abb06fdd30770a # v5.0.1
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          base-path: base
          head-path: head
          # The action defaults to a moving image tag, so pin the digest too (ADR 0034).
          version: sha256:c41fa301958c43faf1b18eb2c415a4ae120144786d3de8018c92a68548cba7b8 # 2.0.16

  apply:
    needs: [static, changes]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.changes.outputs.apply_stacks != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The approval gate. It also changes the OIDC sub to the environment form (ADR 0012).
    environment: terraform-apply
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # One stack at a time, in list order, once more stacks depend on each other.
      max-parallel: 1
      matrix:
        stack: ${{ fromJSON(needs.changes.outputs.apply_stacks) }}
    # Cancelling an apply halfway leaves a state lock and partly applied changes (ADR 0030).
    concurrency:
      group: terraform-${{ matrix.stack }}
      cancel-in-progress: false
    env:
      STACK: ${{ matrix.stack }}
      TF_DIR: terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Mask AWS identifiers
        run: bash .github/scripts/mask-aws-identifiers.sh
      - name: Show the assumed role
        # Printed after masking, so the log proves OIDC without showing the account ID.
        run: aws sts get-caller-identity --query Arn --output text
      - name: Write stack inputs
        env:
          TFVARS_ORG: ${{ secrets.TFVARS_ORG }}
        run: |
          case "$STACK" in
            org) printf '%s\n' "$TFVARS_ORG" ;;
            *) echo "No inputs defined for stack $STACK" >&2; exit 1 ;;
          esac > "$TF_DIR/terraform.tfvars"
      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: >-
          terraform -chdir="$TF_DIR" init -input=false -lockfile=readonly
          -backend-config="bucket=$TF_STATE_BUCKET"
      - name: terraform plan
        id: plan
        run: |
          # 0 = no changes, 2 = changes. set -e would treat 2 as a failure.
          code=0
          terraform -chdir="$TF_DIR" plan -input=false -no-color -detailed-exitcode \
            -out=tfplan > /dev/null || code=$?
          [ "$code" -ne 1 ] || exit 1
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "### Terraform apply: \`$STACK\`"
            echo
            terraform -chdir="$TF_DIR" show -json tfplan | jq -r -f .github/scripts/plan-summary.jq
          } >> "$GITHUB_STEP_SUMMARY"
      - name: terraform apply
        if: steps.plan.outputs.exit_code == '2'
        # sed strips the [id=...] on progress lines, for the same reason plan drops stdout.
        run: |
          terraform -chdir="$TF_DIR" apply -input=false -no-color tfplan \
            | sed -u -E 's/ ?\[id=[^]]*\]//'

  # The only required check (ADR 0035). Skipped jobs are fine; failed or cancelled ones are not.
  ci-ok:
    if: always()
    needs: [static, changes, plan, infracost, apply]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check every needed job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
